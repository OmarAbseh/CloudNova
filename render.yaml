# Render blueprint for the CloudNova dashboard.
# Deploy: push to GitHub, then New > Blueprint on render.com and pick this repo.
services:
  - type: web
    name: cloudnova
    runtime: python
    plan: starter
    buildCommand: pip install -e ".[web]"
    startCommand: cloudnova-web
    envVars:
      - key: CLOUDNOVA_WEB_HOST
        value: 0.0.0.0
      # Accounts and per-org isolation come from the Floatly Platform. The
      # server refuses to bind a public interface without these, so a deploy
      # missing them fails fast rather than coming up unauthenticated.
      - key: SUPABASE_URL
        sync: false   # set in the Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # publishable key; RLS still filters every request
      # Deliberately absent: SUPABASE_SERVICE_ROLE_KEY. It bypasses RLS and the
      # dashboard never uses it.
      - key: PYTHON_VERSION
        value: "3.12"
