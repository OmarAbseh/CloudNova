[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudnova"
version = "0.1.0"
description = "Cloud security scanning engine: finds misconfigurations in IaC and cloud accounts, and maps them to attack paths."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omar Abseh" }]
keywords = ["cloud-security", "devsecops", "iac", "misconfiguration", "aws", "security-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-hcl2>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
mcp = [
    "mcp>=1.2",
]
agent = [
    "anthropic>=0.40",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
aws = [
    "boto3>=1.34",
]
azure = [
    "azure-identity>=1.16",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-sql>=3.0",
]

[project.scripts]
cloudnova = "cloudnova.cli:app"
cloudnova-mcp = "cloudnova.mcp_server:main"
cloudnova-web = "cloudnova.web.server:main"

[project.urls]
Homepage = "https://github.com/OmarAbseh/CloudNova"
Repository = "https://github.com/OmarAbseh/CloudNova"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudnova"]

# ---- Ruff: linter + formatter ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The web app is presentation-heavy: long CSS/HTML string literals are clearer
# left intact than wrapped, so the line-length rule is relaxed for it only.
"src/cloudnova/web/app.py" = ["E501"]
# Presentation-heavy: long HTML/CSS string literals for the print-ready report.
"src/cloudnova/range/checklist/report.py" = ["E501"]
# The checklist is a wide data table (methodology rows); rows read better on one line.
"src/cloudnova/range/checklist/blackbox.py" = ["E501"]
# The cloud collectors defensively swallow per-service SDK errors so partial
# credentials still yield a partial inventory — that pattern is intentional here.
"src/cloudnova/cloud/_aws_collect.py" = ["BLE001", "SIM105"]
"src/cloudnova/cloud/_azure_collect.py" = ["BLE001", "SIM105"]

# ---- mypy: strict typing on our source ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The MCP adapter wraps an optional, dynamically-typed SDK (server is Any across
# v1/v2), so its tool decorators are untyped by nature. Relax just those checks
# here; the real logic lives in the fully-typed cloudnova.service.
[[tool.mypy.overrides]]
module = "cloudnova.mcp_server"
disable_error_code = ["misc", "untyped-decorator"]

# The cloud collectors wrap optional, untyped vendor SDKs (boto3, azure-*). Their
# import and dynamic responses are Any by nature; the typed logic is in the checks.
[[tool.mypy.overrides]]
module = ["cloudnova.cloud._aws_collect", "cloudnova.cloud._azure_collect"]
disable_error_code = ["misc", "no-any-return", "import-not-found", "import-untyped"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
