[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudnova"
version = "0.1.0"
description = "Cloud security scanning engine: finds misconfigurations in IaC and cloud accounts, and maps them to attack paths."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omar Abseh" }]
keywords = ["cloud-security", "devsecops", "iac", "misconfiguration", "aws", "security-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
cloudnova = "cloudnova.cli:app"

[project.urls]
Homepage = "https://github.com/OmarAbseh/CloudNova"
Repository = "https://github.com/OmarAbseh/CloudNova"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudnova"]

# ---- Ruff: linter + formatter ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]

# ---- mypy: strict typing on our source ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
