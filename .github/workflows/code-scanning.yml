# Runs CloudNova on the repo and uploads findings to GitHub code-scanning,
# so they appear inline on pull requests and in the Security tab. This is
# CloudNova dogfooding itself.
name: CloudNova code scanning

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run CloudNova (SARIF)
        # Never fail the job here; the SARIF upload surfaces findings instead.
        run: cloudnova scan examples --format sarif > cloudnova.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cloudnova.sarif
          category: cloudnova
