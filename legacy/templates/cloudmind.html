<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CloudMind – AI Config Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4 text-center">☁️ CloudMind – AI Config Generator</h1>

    {% if yaml %}
    <div class="card p-3 mb-4">
        <h4>🔐 Generated Config</h4>
        <pre class="bg-white border p-3">{{ yaml }}</pre>

        <form method="POST" action="/download-config">
            <input type="hidden" name="yaml" value="{{ encoded }}">
            <button class="btn btn-outline-dark w-100 mt-2">📄 Download Config (YAML)</button>
        </form>
    </div>
    {% endif %}

    <form method="POST" action="/cloudmind">
        <div class="mb-3">
            <label><strong>Select Services:</strong></label><br>
            {% for s in ['EC2', 'S3', 'Lambda'] %}
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="services" value="{{ s }}" id="{{ s }}">
                <label class="form-check-label" for="{{ s }}">{{ s }}</label>
            </div>
            {% endfor %}
        </div>

        <div class="mb-3">
            <label><strong>Roles & Permissions:</strong></label>
            <input type="text" name="roles" class="form-control" placeholder="admin:full, dev:upload">
        </div>

        <div class="mb-3">
            <label><strong>Description:</strong></label>
            <textarea name="description" rows="3" class="form-control"></textarea>
        </div>

        <button class="btn btn-outline-info w-100" type="submit">⚙️ Generate Config</button>
    </form>

    <div class="mt-4 text-center">
        <a href="/" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
